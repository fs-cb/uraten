<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィールライブラリー｜URATEN</title>
<meta name="description" content="URATENに参加している活動者のプロフィール一覧。活動名・ジャンル・活動地域で探せます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="hd">
  <div class="hd-in">
    <a class="logo" href="./index.html" aria-label="URATEN トップ">
      <span class="logo-row">
        <span class="logo-word">URATEN</span>
        <svg class="logo-pulse" viewBox="0 0 60 22" fill="none" aria-hidden="true">
          <defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#ff3ea5" stop-opacity=".2"/><stop offset=".5" stop-color="#ff3ea5"/><stop offset="1" stop-color="#8b6cff" stop-opacity=".2"/></linearGradient></defs>
          <path d="M0 11h16l3-5 3 11 4-16 4 18 3-12 2 4h25" stroke="url(#pg)" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </span>
    </a>
  </div>
</header>

<!-- プロフィールライブラリー（一覧。中身は js/library.js が gallery/profile.json から組み立てる） -->
<div class="wrap">
  <main>
    <section class="sec">
      <div class="sec-head">
        <h1 class="sec-title">PROFILE</h1>
        <span class="sec-ja">プロフィールライブラリー</span>
        <span class="sec-line"></span>
        <a class="sec-more" href="./menu.html#profile" target="_blank" rel="noopener noreferrer">掲載する →</a>
      </div>
      <p class="page-intro">URATENに参加している活動者のプロフィールです。カードを押すと、その人のページが開きます。</p>

      <form class="lib-tools" id="libTools" onsubmit="return false" hidden>
        <div class="lib-search">
          <input class="lib-q" id="libQ" type="search" placeholder="活動名で検索" autocomplete="off" enterkeyhint="search" aria-describedby="libQHint">
          <button class="lib-clear" id="libClear" type="button" disabled>クリア</button>
        </div>
        <p class="lib-hint" id="libQHint">名前の一部で探せます。＊（なんでも）・？（1文字）も使えます。</p>
        <div class="lib-group" id="libGenreGroup">
          <span class="lib-label">ジャンル</span>
          <div class="lib-chips" id="libGenres"></div>
        </div>
        <div class="lib-group" id="libAreaGroup">
          <span class="lib-label">活動地域</span>
          <div class="lib-chips" id="libAreas"></div>
        </div>
        <div class="lib-group" id="libPageGroup" hidden>
          <span class="lib-label">掲載内容</span>
          <div class="lib-chips">
            <button class="lib-chip is-page" id="libPage" type="button" aria-pressed="false">INTERVIEW</button>
          </div>
        </div>
      </form>

      <p class="lib-count" id="libCount" hidden></p>
      <div class="grid" id="libGrid"></div>
      <p class="gallery-empty" id="libStatus">読み込んでいます…</p>
      <a class="back" href="./index.html">← トップに戻る</a>
    </section>
  </main>

  <footer class="ft">
    <div class="ft-logo">URATEN</div>
    <div class="ft-links">
      <a href="./terms.html">利用規約</a>
      <a href="./tokushoho.html">特定商取引法に基づく表記</a>
      <a href="./refund.html">返金・キャンセルポリシー</a>
      <a href="./privacy.html">プライバシーポリシー</a>
    </div>
  </footer>
</div>

<script src="./js/works.js"></script>
<script src="./js/library.js"></script>
</body>
</html>
