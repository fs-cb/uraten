<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベントカレンダー｜URATEN</title>
<meta name="description" content="URATENに掲載中のイベント一覧。福岡・天神を中心としたライブ・展示・配信イベントを、開催日順にまとめています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="hd">
  <div class="hd-in">
    <a class="logo" href="./index.html" aria-label="URATEN トップ">
      <span class="logo-row">
        <span class="logo-word">URATEN</span>
        <svg class="logo-pulse" viewBox="0 0 60 22" fill="none" aria-hidden="true">
          <defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#ff3ea5" stop-opacity=".2"/><stop offset=".5" stop-color="#ff3ea5"/><stop offset="1" stop-color="#8b6cff" stop-opacity=".2"/></linearGradient></defs>
          <path d="M0 11h16l3-5 3 11 4-16 4 18 3-12 2 4h25" stroke="url(#pg)" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </span>
    </a>
  </div>
</header>

<div class="wrap">
  <section class="sec" style="margin-top:30px">
    <div class="sec-head">
      <h1 class="sec-title">EVENT</h1>
      <span class="sec-ja">イベントカレンダー</span>
      <span class="sec-line"></span>
    </div>
    <p class="page-intro">URATENに掲載中のイベントです。イベントをタップすると、主催者の告知ページが新しいタブで開きます。詳しい内容・料金・参加方法は、リンク先でご確認ください。</p>

    <h2 class="cal-head">これから</h2>
    <div class="cal" id="calSoon">
      <div class="cal-empty">イベント情報を読み込んでいます…</div>
    </div>

    <details class="cal-done" id="calDoneWrap" hidden>
      <summary>終了したイベント<span id="calDoneCount"></span></summary>
      <div class="cal" id="calDone"></div>
    </details>
  </section>

  <footer class="ft">
    <div class="ft-logo">URATEN</div>
    <div class="ft-links">
      <a href="./terms.html">利用規約</a>
      <a href="./tokushoho.html">特定商取引法に基づく表記</a>
      <a href="./refund.html">返金・キャンセルポリシー</a>
      <a href="./privacy.html">プライバシーポリシー</a>
    </div>
  </footer>
</div>

<script src="./js/calendar.js"></script>
<script>
  uratenCalendar.renderFull();
</script>
</body>
</html>
